<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>restore-listen</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">restore<span>·</span>listen</div>
    <div class="pack-info" id="packInfo">no pack selected</div>
    <button id="btnPick" class="ghost">Open pack…</button>
    <button id="btnCsv" class="ghost">Export CSV</button>
  </header>

  <main>
    <section class="item">
      <div class="item-head">
        <div class="item-title" id="itemTitle">—</div>
        <div class="item-note" id="itemNote"></div>
      </div>

      <div class="variants" id="variants"></div>

      <div class="transport">
        <button id="btnPlay" class="primary">▶ Play</button>
        <button id="btnLoop" class="ghost toggled">⟲ Loop</button>
        <span class="time" id="time">0:00 / 0:12</span>
        <input type="range" id="seek" min="0" max="1000" value="0" />
      </div>

      <div class="level-note" id="levelNote"></div>

      <div class="rating">
        <div class="rating-prompt">Which one sounds better? (levels are LUFS-matched)</div>
        <div class="rating-buttons" id="ratingButtons"></div>
        <button id="btnReveal" class="ghost">Show answer</button>
        <div class="reveal" id="reveal"></div>
      </div>

      <div class="hint">
        Space — play/stop · 1/2/3 — variant · ←/→ — ±2 s · L — loop · R — show answer
      </div>
    </section>

    <aside class="list">
      <div class="list-head">
        <span>Items</span>
        <span id="progress">0 / 0</span>
      </div>
      <ol id="items"></ol>
    </aside>
  </main>

  <script src="player.js"></script>
</body>
</html>
